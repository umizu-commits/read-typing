<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ページが見つかりません (404) | ReadTyping</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f8fafc;
      font-family: ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    footer {
      border-top: 1px solid #e5e7eb;
      background: white;
      outline: none;
    }
    .header-inner {

      padding: 0 80px;
      height: 56px;
      display: flex;
      align-items: center;
    }
    .logo {
      color: #2563eb;
      font-weight: bold;
      font-size: 1.125rem;
      text-decoration: none;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: #60a5fa;
      line-height: 1;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1e293b;
      margin-top: 16px;
    }
    .error-message {
      color: #64748b;
      margin-top: 12px;
      font-size: 0.875rem;
    }
    .home-link {
      display: inline-block;
      margin-top: 32px;
      background-color: #60a5fa;
      color: white;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .home-link:hover { background-color: #3b82f6; }
    .footer-inner {
      padding: 24px 20px;
      text-align: center;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">ReadTyping</a>
    </div>
  </header>
  <main>
    <p class="error-code">404</p>
    <h1 class="error-title">ページが見つかりません</h1>
    <p class="error-message">URLが間違っているか、ページが移動・削除された可能性があります。</p>
    <a href="/" class="home-link">トップへ戻る</a>
  </main>
  <footer>
    <div class="footer-inner">&copy; 2026 ReadTyping</div>
  </footer>
</body>
</html>
